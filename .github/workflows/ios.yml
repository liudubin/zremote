name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install xcodegen & ldid
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Build (unsigned, device arm64)
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project ZRemote.xcodeproj -scheme ZRemote \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath .build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} build 2>&1 | tail -40

      - name: Fake-sign & package IPA
        run: |
          APP=ios/.build/Build/Products/Release-iphoneos/ZRemote.app
          ldid -S "$APP/ZRemote"
          rm -rf pkg dist && mkdir -p pkg/Payload dist
          cp -R "$APP" pkg/Payload/
          (cd pkg && zip -qry "../dist/ZRemote-${{ github.run_number }}-ios-unsigned.ipa" Payload)
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZRemote-ios
          path: dist/*.ipa
          retention-days: 30

      - name: Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" dist/*.ipa \
            --title "ZRemote iOS $TAG" \
            --notes "未签名 IPA (ldid 假签) — 越狱 (RootHide/AppSync) 或 TrollStore 直装; 也可用自签工具签名后安装。" \
            --latest || true
